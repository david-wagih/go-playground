name: PR Review with Secret Scanning

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  # First job: Scan for secrets
  gitleaks-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | jq -r .tag_name | tr -d 'v')
          curl -sSL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks
        id: gitleaks
        run: |
          gitleaks detect --redact --verbose --no-git=false -f json -r gitleaks-report.json
        continue-on-error: true

      - name: Check for leaks
        id: check_leaks
        run: |
          if [[ -s gitleaks-report.json ]]; then
            echo "leaks_found=true" >> $GITHUB_OUTPUT
            {
              echo "## 🚨 Secret Leak Detected! 🚨";
              echo "";
              echo "⚠️ **Hey fellow, you leaked a secret!**";
              echo "Please review the report and remove sensitive data before merging.";
              echo "";
              echo '```';
              jq -r '.[] | "File: \(.File):\(.StartLine) → \(.RuleID)"' gitleaks-report.json;
              echo '```';
            } > leaks_summary.txt
          else
            echo "leaks_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Post Comment on PR if leaks found
        if: steps.check_leaks.outputs.leaks_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "$(cat leaks_summary.txt)"

      - name: Upload Report as Artifact
        if: steps.check_leaks.outputs.leaks_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      - name: Fail if leaks are found
        if: steps.check_leaks.outputs.leaks_found == 'true'
        run: exit 1

  # Second job: Only runs if no secrets were found
  second-job:
    needs: gitleaks-scan
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run second job tasks
        run: |
          echo "No secrets were found in the PR. Proceeding with additional checks..."
          # List files to verify what's in the repository
          echo "Files in repository:"
          ls -la
          
      - name: Run additional security checks
        run: |
          echo "Running additional security checks..."
          # This is where you would add more security checks
          # For example, dependency scanning, code quality checks, etc.
          
      - name: Complete second job
        run: |
          echo "Second job completed successfully!"
          echo "Pipeline verification complete - workflow is functioning as expected."